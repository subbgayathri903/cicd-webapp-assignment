
name: Web Application CI/CD

# Trigger workflow when code is pushed to main
# or when a pull request targets main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # STAGE 1: AUTOMATED TESTING
  test:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Download repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install application dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # Execute automated tests
      - name: Run unit tests
        run: |
          python -m unittest discover -s app -p "test_*.py" -v

  # STAGE 2: DOCKER IMAGE BUILD
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      # Download repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t cicd-webapp:${{ github.sha }} .

      # Verify Docker image
      - name: Verify Docker image
        run: |
          docker image inspect cicd-webapp:${{ github.sha }}
