name: Web Application CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: cicd-webapp
  ECR_REGISTRY: 472567279238.dkr.ecr.ap-southeast-2.amazonaws.com
  EC2_INSTANCE_ID: i-03622c11524e194d2

jobs:

  # STAGE 1: AUTOMATED TESTING
  test:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s app -p "test_*.py" -v

  # STAGE 2: DOCKER IMAGE BUILD
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker image inspect \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Save Docker image
        run: |
          docker save \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -o cicd-webapp.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-webapp-image
          path: cicd-webapp.tar
          retention-days: 1

  # STAGE 3: PUSH IMAGE TO PRIVATE AWS ECR
  push:
    name: Push Docker Image to AWS ECR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-webapp-image

      - name: Load Docker image
        run: |
          docker load -i cicd-webapp.tar

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::472567279238:role/cicd-webapp-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  # STAGE 4: DEPLOY TO AWS EC2 THROUGH SSM
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest
    needs: push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::472567279238:role/cicd-webapp-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application using SSM
        shell: bash
        run: |
          set -e

          COMPOSE_B64=$(base64 -w 0 docker-compose.prod.yml)
          NGINX_B64=$(base64 -w 0 nginx/nginx.conf)

          PARAMS=$(jq -n \
            --arg compose "$COMPOSE_B64" \
            --arg nginx "$NGINX_B64" \
            --arg registry "$ECR_REGISTRY" \
            --arg region "$AWS_REGION" \
            --arg repository "$ECR_REPOSITORY" \
            --arg tag "$GITHUB_SHA" \
            '{
              commands: [
                "set -e",
                "mkdir -p /opt/cicd-webapp/nginx",
                ("echo " + $compose + " | base64 -d > /opt/cicd-webapp/docker-compose.prod.yml"),
                ("echo " + $nginx + " | base64 -d > /opt/cicd-webapp/nginx/nginx.conf"),
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                ("export ECR_IMAGE=" + $registry + "/" + $repository + ":" + $tag + " && cd /opt/cicd-webapp && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d")
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --comment "Deploy CI/CD web application" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "SSM_COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$SSM_COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$SSM_COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out"
          exit 1

  # STAGE 5: APPLICATION HEALTH VERIFICATION
  verify:
    name: Verify Application Health
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check application health
        run: |
          for i in {1..12}; do
            if curl --fail --silent http://13.236.85.230/health; then
              echo "Application health check successful"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 10
          done

          echo "Application health check failed"
          exit 1

  notify:
    name: Send Slack Notification
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Send deployment success notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE="Deployment successful!
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Application: http://13.236.85.230/
          Health Check: Passed"

          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
